  macros:
    language:
      name: language
      container: true
      children:
        - option
      skipArgs: true
      description: |-
        根据当前 maplebirch.Language 渲染对应语言内容。

        示例：

        <<language>>
          <<option 'CN'>>
            中文内容
          <<option 'EN'>>
            English content
        <</language>>
    lanSwitch:
      name: lanSwitch
      skipArgs: true
      description: |-
        根据当前语言输出不同文本。

        示例：

        <<lanSwitch '中文' 'English'>>

        或：

        <<lanSwitch { CN: '中文', EN: 'English' }>>
    lanButton:
      name: lanButton
      container: true
      skipArgs: true
      description: >-
        多语言按钮。


        示例：


        <<lanButton 'start game' 'title' 'class:main-button'>>
          <<goto 'Start'>>
        <</lanButton>>


        支持参数：

        class:xxx

        style:xxx

        lower / upper / capitalize / title / camel / pascal / snake / kebab /
        constant
    lanLink:
      name: lanLink
      container: true
      skipArgs: true
      description: >-
        多语言链接。


        示例：


        <<lanLink 'go home' 'Home'>><</lanLink>>


        或：


        <<lanLink { text: 'go home', link: 'Home' }>>


        支持参数：

        class:xxx

        style:xxx

        lower / upper / capitalize / title / camel / pascal / snake / kebab /
        constant
    lanListbox:
      name: lanListbox
      container: true
      children:
        - option
        - optionsfrom
      skipArgs: true
      description: |-
        maplebirch 多语言下拉框。

        示例：

        <<lanListbox '$options.maplebirch.character.charArt.select' autoselect>>
          <<option 'low ombré' 'low-ombre' 'title'>>
          <<option 'high ombré' 'high-ombre' 'title'>>
          <<option 'split' 'split' 'title'>>
          <<option 'face-framing highlights' 'face-frame' 'title'>>
        <</lanListbox>>

        支持参数：
        autoselect
        class:xxx
        style:xxx
    option:
      name: option
      skipArgs: true
      parents:
        - language
        - lanListbox
        - listbox
        - cycle
      description: |-
        选项子宏。

        在 language 中：

        <<language>>
          <<option 'CN'>>中文内容
          <<option 'EN'>>English content
        <</language>>

        在 lanListbox 中：

        <<lanListbox '$xxx' autoselect>>
          <<option 'low ombré' 'low-ombre' 'title'>>
          <<option 'high ombré' 'high-ombre' 'title'>>
        <</lanListbox>>

        注意：
        这里必须 skipArgs: true，否则 T3LT 会按 SugarCube 原生 option 校验，
        第三个参数只认 selected，不认 title / upper / lower 等 maplebirch 转换模式。
    optionsfrom:
      name: optionsfrom
      skipArgs: true
      parents:
        - lanListbox
      description: |-
        lanListbox 的动态选项来源。

        示例：

        <<lanListbox '$selectedItem'>>
          <<optionsfrom $items>>
        <</lanListbox>>

        或：

        <<lanListbox '$selectedItem'>>
          <<optionsfrom $items 'title'>>
        <</lanListbox>>
    radiobuttonsfrom:
      name: radiobuttonsfrom
      container: true
      skipArgs: true
      description: |-
        根据数组或字符串生成一组 radio button。

        示例：

        <<radiobuttonsfrom '$choice' 'A|B|C'>><</radiobuttonsfrom>>

        自定义分隔符：

        <<radiobuttonsfrom '$choice' 'A|B|C' ' / '>><</radiobuttonsfrom>>
    maplebirchReplace:
      name: maplebirchReplace
      skipArgs: true
      description: |-
        替换或切换 maplebirch overlay 内容。

        示例：

        <<maplebirchReplace 'inventory' 'content'>>
    maplebirchOptions:
      name: maplebirchOptions
    maplebirchNPCHairStyleOptions:
      name: maplebirchNPCHairStyleOptions
    maplebirchTransformationPartSelect:
      name: maplebirchTransformationPartSelect
    maplebirchTimeTravel:
      name: maplebirchTimeTravel
    updatesidebarimg:
      description: |-
        Updates sidebar img

        `<<updatesidebarimg clearCache?>>`
        - **clearCache** _optional_: `string` - clear render cache
          - Defaults to true
      parameters:
        - '|+ bool'
    numberStepper:
      description: >-
        Adds a number stepper element


        `<<numberStepper title initialValue setter options?>>`

        - **title**: `string` - title to be displayed in the titlebox

        - **initialValue**: `number` - initial value to display when the stepper
        is rendered
          - Clamped between `minValue` and `maxValue`
        - **setter**: `string | function` - source of current value
          - `string`: current value is determined by state variable (e.g., `"purity"` -> `$purity`)
          - `function`: current value is determined by return value
        - **options** _optional_: `object` - object containing additional
        optional settings
          - **max** _optional_: `number` - maximum allowed value
            - Defaults to `100`
          - **min** _optional_: `number` - minimum allowed value
            - Defaults to `0`
          - **step** _optional_: `number` - amount value changes with a single arrow and `x10` with a double arrow
            - Defaults to `1%` of the range
          - **percentage** _optional_: `boolean` - value is converted to a percentage
            - Defaults to `true`
          - **colorArr** _optional_: `Array` - custom colours to replace the default range
          - **reverse** _optional_: `boolean` - reverse direction of color range
            - Defaults to `false`
          - **valueFormat** _optional_: `function` - function modifying how value is displayed
            - `function`: fn: (value: number, percentage: number) => string
            - Example: `(value, percentage) => "$" + value`
          - **tooltip** _optional_: `tooltip` - tooltip object
            - Example: `{ message: () => V.physique, delay: 200 }`
          - **values** _optional_: `Array` - values to be used in above functions
          - **reverseButtons** _optional_: `boolean` - reverse function of buttons
            - Defaults to `false`
          - **activeButtons** _optional_: `Array` - specifies active buttons
            - Defaults to `["single", "double", "minMax"]`
            - <`"single"|"double"|"triple"|"minMax"`>`[]`
          - **css** _optional_: `string` - overrides the default container css
          - **callback** _optional_: `function` - callback for whenever the value changes
      skipArgs: true
      tags:
        - text
        - links
    iconUi:
      description: >-
        Prints image from UI folder, constrained to icon dimensions (30x30)


        Most often used with sym and tf UI icons.


        `<<iconUi imagePath ...options?>>`

        - **imagePath**: `string` - path to image file including extension
        relative to UI folder

        - ...**options** _optional_: `string` - additional options to modify
        formatting
          - `"nowhitespace"`: no trailing whitespace for formatting
          - `"infront"`: layer icon in front of next icon
          - `"flip"`: flipicon
          - `"with-text"`: use 18x18 container instead of 30x30 to prevent inline icons from changing line spacing
      parameters:
        - text |+ ...("nowhitespace"|"infront"|"flip"|"with-text")
      tags:
        - img
    numberslider:
      description: >-
        Adds a number slider element


        `<<numberslider variable defaultValue minValue maxValue stepValue
        callbacks? autofocus?>>`

        - **variable**: `string` - the name of the variable to bind the slider
        to (e.g., `$score` or `_tempValue`)
          - Must start with `$` or `_`.
        - **defaultValue**: `number` - the value to initialize the variable and
        slider with
          - Must be between `minValue` and `maxValue`.
        - **minValue**: `number` - the minimum allowed value for the slider

        - **maxValue**: `number` - the maximum allowed value for the slider

        - **stepValue**: `number` - the interval between allowed values when
        sliding
          - Must be greater than `0`.
        - **callbacks** _optional_: `object` - object containing optional event
        callbacks
          - **onInputChange** _optional_: `function` - called periodically as the slider moves
            - Example: `(newValue) => console.log("Slider changed:", newValue)`
          - **value** _optional_: `function` - formats the displayed value
            - Example: `(value) => "$" + value`
          - **onMouseUp** _optional_: `function` - called when the slider is released
            - Example: `(newValue) => console.log("Slider released:", newValue)`
        - **autofocus** _optional_: `string` - automatically focuses the slider
        on passage load
          - Use `"autofocus"` to enable.
      skipArgs: false
      tags:
        - sliders
        - inputs
        - macros
    setupOptions:
      name: setupOptions
